[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cfa-pagermon-bridge"
version = "1.0.0"
description = "Bridge CFA State Incidents feed to PagerMon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "python-dotenv==1.0.1",
    "flask==3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
